[project]
name = "impala-scope"
version = "0.1.0"
description = "Provider-neutral inference analytics without prompt or response retention."
readme = "README.md"
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = ["httpx>=0.27", "mitmproxy>=11.0", "pydantic>=2.7"]

[project.scripts]
impala-scope = "impala_scope.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/impala_scope"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]
